[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-serpapi-provider"
version = "0.1.0"
description = "A LangChain-compatible retriever and tool provider for SerpApi (Scholar, Web, News, Jobs)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Joseph Fernandes" }]
keywords = ["langchain", "serpapi", "retriever", "rag", "llm", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core runtime needs only langchain-core (not the full `langchain` package).
dependencies = [
    "langchain-core>=0.2.0",
    "google-search-results>=2.4.2",
    "pydantic>=2.0.0",
    "diskcache>=5.6.0",
]

[project.optional-dependencies]
agent = [
    "langchain>=0.2.0",
]
# Streamlit research-agent demo in examples/research_agent
demo = [
    "streamlit>=1.35.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]
# Optional NLI backend for the possible-disagreement detector
nli = [
    "transformers>=4.40",
    "torch",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/JosephJonathanFernandes/serpapi-research-toolkit"
Repository = "https://github.com/JosephJonathanFernandes/serpapi-research-toolkit"
Issues = "https://github.com/JosephJonathanFernandes/serpapi-research-toolkit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["langchain_serpapi_provider*"]

[tool.setuptools.package-data]
langchain_serpapi_provider = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
