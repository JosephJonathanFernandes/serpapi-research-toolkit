name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install plugin + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Only needed by the demo-app logic tests (clustering/export/disagreement).
          pip install numpy scikit-learn

      - name: Unit tests (no network, no API key)
        run: pytest -q

      - name: Offline smoke test (hand-written fixtures, 0 API calls)
        run: python scripts/smoke_test.py --dry-run

      - name: Demo-mode fixtures replay without a key
        run: python scripts/test_demo_queries.py --offline
        env:
          SERPAPI_API_KEY: ""

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel and check metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
